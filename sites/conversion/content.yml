  eyebrow: AGENDA ÁUREA 2027 · PREVENTA
  title: Tu año en orden,
  titleAccent: sin culpa por los días en blanco.
  sub: Una agenda que se adapta a tu semana, no al revés. Diez portadas, hojas que resisten el año entero y un espacio para mirar atrás cada domingo.

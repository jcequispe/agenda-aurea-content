faq:
  - q: ¿Cuándo llega?
    a: Coordinamos la fecha contigo por WhatsApp, en Lima y a todo el Perú. Apenas despachemos tu pedido te escribimos con el seguimiento.
  - q: ¿Cuánto cuesta el envío?
    a: Te confirmamos el costo por WhatsApp según tu destino, antes de que pagues.
  - q: ¿Cómo pago?
    a: Nos escribes por WhatsApp y coordinamos el pago con Yape o tarjeta. En esta página no se cobra nada.
  # MOCK (7 días): confirmar la política junto con la garantía
  - q: ¿Y si llega con algún defecto?
    a: Escríbenos dentro de los 7 días de recibirla, con una foto, y te la cambiamos sin costo.
  - q: ¿Qué contiene la agenda?
    a: Ejercicios guiados de transformación emocional, intenciones diarias, hábitos y tu semana completa, mes a mes.
  - q: ¿Puedo cambiar mi pedido después de pagar?
    a: Sí, mientras no hayamos empezado tu envío. Escríbenos y lo ajustamos.


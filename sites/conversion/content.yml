problem:
  eyebrow: ¿TE SUENA?
  title: La mayoría de agendas se abandona en febrero.
  body: No es falta de disciplina. Es que te piden llenar cada casilla, todos los días, y un solo día en blanco ya se siente como un fracaso.
  points:
    - Empiezas con ganas y a las tres semanas ya no la abres.
    - Cada espacio vacío te recuerda lo que no hiciste.
    - Terminas anotando en el celular y la agenda se queda en el cajón.

benefits:
  eyebrow: POR ESO LA HICIMOS DISTINTA
  title: Una agenda que sí vas a usar.
  items:
    - title: Tu año, en una sola vista
      body: Objetivos del mes, lo que entra y lo que sale, todo en una página. Sin cambiar de app.
      image: imperfecta/features/feature-1.jpg
    - title: Lo que repites, a la vista
      body: Una cuadrícula para marcar lo que ya hiciste, no otra lista de lo que te falta.
      image: imperfecta/features/feature-2.jpg
    - title: Un espacio para mirar atrás
      body: Tres preguntas al cierre de cada semana para ajustar la siguiente sin empezar de cero.
      image: imperfecta/features/feature-3.jpg


faq:
  - q: ¿Cuándo llega?
    a: "Es preventa: pagas hoy y los envíos empiezan el 15 de enero de 2027. Apenas despachemos la tuya, te mandamos el seguimiento."
  - q: ¿Por qué hacen preventa?
    a: Así imprimimos exactamente lo que se vende, sin stock de más que termine rematado ni faltante que te deje esperando.
  - q: ¿La diaria cuesta más?
    a: No. Mismo precio, elijas semanal o diaria.
  - q: ¿Cómo coordinan la entrega?
    a: Te escribimos por WhatsApp para confirmar dirección y la mejor fecha, en Lima y para el resto del país.
  - q: ¿Puedo cambiar el formato o la portada después de pagar?
    a: Sí, mientras no hayamos empezado tu envío. Escríbenos y lo ajustamos.


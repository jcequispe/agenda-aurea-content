problem:
  eyebrow: ¿TE SUENA?
  title: La mayoría de agendas solo reciben tareas.
  body: Sabemos lo que es prometerte un año distinto y que la rutina te gane. Las agendas de siempre nunca te preguntan cómo estás, qué sientes o hacia dónde quieres ir. Terminan llenas de pendientes y vacías de ti.
  points:
    - Anotas lo que tienes que hacer, nunca cómo lo estás llevando.
    - No hay espacio para una intención, solo para una casilla.
    - A mitad de año ya no sabes si avanzaste o solo tachaste pendientes.

